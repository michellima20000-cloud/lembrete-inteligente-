<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch is writable and configurable to prevent chrome extensions
      // from throwing "Cannot set property fetch of #<Window> which has only a getter"
      try {
        const origFetch = window.fetch;
        if (origFetch) {
          let activeFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return activeFetch;
            },
            set(newVal) {
              activeFetch = newVal;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (err) {
        // Fallback if property is non-configurable in some engine
      }

      // Safeguard for Vite HMR WebSocket in container environment (HMR disabled in AI Studio)
      try {
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function (url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && url.includes('token='))) {
              const target = new EventTarget();
              target.readyState = 1; // OPEN
              target.url = url;
              target.protocol = 'vite-hmr';
              target.close = () => {};
              target.send = () => {};
              setTimeout(() => {
                try { target.dispatchEvent(new Event('open')); } catch {}
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      } catch (wsErr) {}

      // Suppress unhandled errors originating from external browser extensions or Vite HMR disconnects
      window.addEventListener(
        'error',
        function (event) {
          const msg = (event.message || (event.error && (event.error.message || event.error.stack)) || '') + '';
          const filename = event.filename || '';
          if (
            msg.includes('WebSocket') ||
            filename.includes('@vite/client') ||
            filename.startsWith('chrome-extension://') ||
            filename.startsWith('moz-extension://') ||
            filename.startsWith('safari-web-extension://')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );

      window.addEventListener(
        'unhandledrejection',
        function (event) {
          const reason = event.reason;
          const msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('@vite/client') ||
            msg.includes('chrome-extension://') ||
            msg.includes('moz-extension://') ||
            msg.includes('safari-web-extension://')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );

      // Early PWA install prompt capture
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lembrete Inteligente</title>

    <meta property="og:title" content="Lembrete Inteligente" />
    <meta property="og:description" content="Agenda inteligente de lembretes locais com sincronização em tempo real no Firebase Cloud e comandos por voz." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lembretes" />

    <link rel="preload" as="image" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  </body>
